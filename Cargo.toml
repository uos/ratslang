[workspace]
members = ["ratslang", "ratslang-cli", "ratslang-lsp"]
resolver = "3"

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.85.1"
license = "MIT OR Apache-2.0"
repository = "https://codeberg.org/stelzo/ratslang"

[workspace.dependencies]
ratslang = { version = "0.5.0", path = "ratslang" }
anyhow = "1.0.104"
serde = "1.0.229"

# Release binaries, packages and the Homebrew formula
[profile.full-release]
inherits = "release"
lto = "fat"
codegen-units = 1
