[package]
name = "ratslang"
version = "0.4.3"
edition = "2024"
authors = ["stelzo <stelzo@steado.de>"]
description = "A minimal and extensible configuration language for fallible humans working with physical systems."
repository = "https://codeberg.org/stelzo/ratslang"
license = "MIT OR Apache-2.0"
keywords = ["config", "lang", "parser", "robotics"]
categories = ["science::robotics", "parser-implementations"]
readme = "README.md"
documentation = "https://docs.rs/ratslang"
homepage = "https://lib.rs/crates/ratslang"
exclude = [".cargo_vcs_info.json", ".forgejo/*", "vscode/*", "target/*"]
rust-version = "1.85.1"

[dependencies]
log = "0.4.34"
logos = "0.16.1"
chumsky = { version = "0.13", default-features = false, features = ["std"] }
ariadne = "0.6"
anyhow = "1.0"
uom = "0.38.0"
