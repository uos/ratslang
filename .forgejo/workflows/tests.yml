name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-dev-noble

    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          apt-get update
          apt-get install -y build-essential
      - name: Build
        run: cargo build
      - name: Run tests
        run: cargo test
      - name: Verify msrv
        run: |
          set -euo pipefail
          # Each crate builds with the toolchain its rust-version names, inherited
          # from the workspace or set in its own manifest.
          cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json, sys; [print(p["name"], p["rust_version"]) for p in json.load(sys.stdin)["packages"]]' \
            | while read -r name version; do
                rustup toolchain install "$version" --profile minimal
                cargo "+$version" check --locked --all-features --all-targets --package "$name"
              done
