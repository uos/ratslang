name: Documentation
on:
  pull_request:
  push:
    branches: [main, lsp]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-dev-noble
    steps:
      - uses: actions/checkout@v4
      - name: Check documentation examples
        run: python3 scripts/check_docs.py
      - name: Build documentation
        run: |
          # The highlighter builds the tree-sitter-ratslang Python binding, which needs Python.h
          apt-get update
          apt-get install -y python3-dev
          cd docs
          uvx --from zensical==0.0.71 --with ./pygments-ratslang zensical build --clean --strict
      - name: Deploy to ratslang.steado.tech
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          DOCS_DEPLOY_KEY: ${{ secrets.DOCS_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y --no-install-recommends rsync openssh-client
          key="$(mktemp)"
          hosts="$(mktemp)"
          trap 'rm -f "$key" "$hosts"' EXIT
          printf '%s\n' "$DOCS_DEPLOY_KEY" >"$key"
          echo "[ratslang.steado.tech]:2222 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBvqpiJdvk+zuDXcjOgNdA3p98+6L7MAnhOEOLrw4phX" >"$hosts"
          # The key may only rsync into /var/www/ratslang.steado.tech (rrsync on the server).
          rsync -rlt --checksum --delete --delay-updates --chmod=D755,F644 --stats \
            -e "ssh -p 2222 -i $key -o IdentitiesOnly=yes -o BatchMode=yes -o UserKnownHostsFile=$hosts -o StrictHostKeyChecking=yes" \
            docs/site/ ratslang-docs@ratslang.steado.tech:
