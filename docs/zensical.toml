# Zensical setup reused from Pelorus; Ratslang has no generated parameter nav.
[project]
site_name = "Ratslang"
site_description = "A compact configuration language with physical units, schemas, and typed Rust integration."
site_author = "stelzo <stelzo@steado.de>"
site_url = "https://ratslang.steado.tech/docs/"
repo_url = "https://codeberg.org/stelzo/ratslang"
repo_name = "stelzo/ratslang"
copyright = "Copyright &copy; 2026 stelzo"
strict = true
extra_css = ["stylesheets/fonts.css", "stylesheets/seakit.css", "stylesheets/brand.css"]
nav = [
  { "Introduction" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "Language" = [
    { "Values and syntax" = "language/values.md" },
    { "Namespaces and includes" = "language/namespaces-and-includes.md" },
    { "Units and dimensions" = "language/units.md" },
    { "Comment annotations" = "language/annotations.md" },
  ] },
  { "Schemas and constraints" = "schemas.md" },
  { "Rust integration" = [
    { "Serde and typed config" = "rust/serde.md" },
    { "Preserving source" = "rust/document-editing.md" },
    { "Compiler and values" = "rust/compiler.md" },
  ] },
  { "Command-line tools" = "tools/cli.md" },
  { "Editors" = [
    "editors/index.md",
    { "Helix" = "editors/helix.md" },
    { "Neovim" = "editors/neovim.md" },
    { "VS Code" = "editors/vscode.md" },
  ] },
  { "Rust API reference" = "https://docs.rs/ratslang" },
]

# The theme block below is shared by every SeaKit site. Only the logo differs.
# Colours come from docs/stylesheets/brand.css, through seakit.css.
[project.theme]
font = false
language = "en"
logo = "images/ratslang.svg"
favicon = "images/ratslang.svg"
features = [
  "announce.dismiss",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.theme.icon]
repo = "fontawesome/brands/git-alt"
