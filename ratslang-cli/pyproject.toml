[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "ratslang-cli"
description = "Check, format, explain and migrate Ratslang configuration files"
readme = "README.md"
dynamic = ["version"]
requires-python = ">=3.8"
license = { text = "MIT OR Apache-2.0" }
keywords = ["config", "robotics", "ratslang"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Rust",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]

[project.urls]
Documentation = "https://stelzo.codeberg.page/ratslang/tools/cli/"
Repository = "https://codeberg.org/stelzo/ratslang"

[tool.maturin]
bindings = "bin"
