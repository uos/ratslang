[package]
name = "ratslang"
version.workspace = true
edition.workspace = true
description = "A minimal and extensible configuration language for fallible humans working with physical systems."
repository.workspace = true
license.workspace = true
keywords = ["config", "lang", "parser", "robotics"]
categories = ["science::robotics", "parser-implementations"]
readme = "../README.md"
documentation = "https://docs.rs/ratslang"
homepage = "https://lib.rs/crates/ratslang"
rust-version.workspace = true

[dependencies]
log = "0.4.34"
logos = "0.16.1"
chumsky = { version = "0.13.0", default-features = false, features = ["std"] }
ariadne = "0.6.0"
anyhow.workspace = true
uom = "0.38.0"
serde = { workspace = true, optional = true, features = ["derive"] }

[features]
default = []
uom = ["uom/serde"]
serde = ["dep:serde", "uom"]

[package.metadata.docs.rs]
all-features = true
